<!DOCTYPE html>
<html class="light" lang="vi">
<head>
	<meta charset="utf-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<title>QR HUB</title>
	<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
	<script id="tailwind-config">
		tailwind.config = {
			darkMode: "class",
			theme: {
				extend: {
					"colors": {
						"surface-container-lowest": "#ffffff",
						"secondary-container": "#6cf8bb",
						"surface-container-high": "#e7e7f3",
						"primary-fixed": "#dbe1ff",
						"tertiary-fixed-dim": "#ffb596",
						"error-container": "#ffdad6",
						"on-tertiary": "#ffffff",
						"outline": "#737686",
						"on-secondary-fixed": "#002113",
						"on-secondary-fixed-variant": "#005236",
						"background": "#faf8ff",
						"on-tertiary-fixed": "#360f00",
						"on-secondary-container": "#00714d",
						"surface-variant": "#e1e2ed",
						"on-error-container": "#93000a",
						"error": "#ba1a1a",
						"tertiary": "#943700",
						"on-primary": "#ffffff",
						"on-tertiary-container": "#ffede6",
						"inverse-primary": "#b4c5ff",
						"primary-fixed-dim": "#b4c5ff",
						"primary": "#004ac6",
						"on-primary-fixed": "#00174b",
						"surface-container-low": "#f3f3fe",
						"surface-container": "#ededf9",
						"outline-variant": "#c3c6d7",
						"tertiary-container": "#bc4800",
						"on-surface-variant": "#434655",
						"surface-container-highest": "#e1e2ed",
						"on-surface": "#191b23",
						"inverse-on-surface": "#f0f0fb",
						"surface-tint": "#0053db",
						"secondary-fixed-dim": "#4edea3",
						"surface-bright": "#faf8ff",
						"inverse-surface": "#2e3039",
						"on-error": "#ffffff",
						"secondary-fixed": "#6ffbbe",
						"secondary": "#006c49",
						"on-primary-fixed-variant": "#003ea8",
						"on-tertiary-fixed-variant": "#7d2d00",
						"tertiary-fixed": "#ffdbcd",
						"primary-container": "#2563eb",
						"surface": "#faf8ff",
						"on-secondary": "#ffffff",
						"on-background": "#191b23",
						"on-primary-container": "#eeefff",
						"surface-dim": "#d9d9e5"
					},
					"borderRadius": {
						"DEFAULT": "0.25rem",
						"lg": "0.5rem",
						"xl": "0.75rem",
						"full": "9999px"
					},
					"spacing": {
						"card-gap": "32px",
						"base-unit": "8px",
						"margin-desktop": "40px",
						"gutter": "24px",
						"margin-mobile": "20px",
						"container-max": "1440px"
					},
					"fontFamily": {
						"body-lg": ["Inter"],
						"headline-md": ["Inter"],
						"display-lg": ["Inter"],
						"body-md": ["Inter"],
						"label-sm": ["Inter"],
						"headline-lg-mobile": ["Inter"],
						"label-md": ["Inter"],
						"headline-lg": ["Inter"]
					},
					"fontSize": {
						"body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
						"headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
						"display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
						"body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
						"label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
						"headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
						"label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "500"}],
						"headline-lg": ["30px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
					}
				},
			},
		}
	</script>
	<link href="style.css" rel="stylesheet">
</head>
<body class="bg-background text-on-surface selection:bg-primary/20">

<!-- TopNavBar -->
<header class="bg-surface/80 backdrop-blur-xl shadow-sm fixed top-0 w-full z-50">
	<div class="flex justify-between items-center w-full px-margin-desktop py-4 max-w-container-max mx-auto">
		<div class="font-headline-lg text-headline-lg font-bold text-primary">QR Hub</div>
		<div class="flex items-center gap-6"></div>
	</div>
</header>

<main class="pt-24 pb-20">
	<!-- Hero & Search -->
	<section class="relative px-margin-desktop max-w-container-max mx-auto mb-12">
		<div class="bg-white/40 backdrop-blur-2xl rounded-[32px] p-8 md:p-12 border border-white/60 shadow-xl overflow-hidden relative">
			<div class="relative z-10">
				<div class="flex flex-col gap-8">
					<div class="flex flex-col items-center justify-between gap-6 w-full">
						<div class="relative w-full">
							<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
							<input id="searchInput" class="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md text-body-md placeholder:text-slate-400 shadow-sm" placeholder="Tìm theo tên, số tài khoản hoặc ngân hàng..." type="text">
						</div>
						<div class="flex flex-wrap gap-2" id="bankFilters">
							<!-- Dynamic Bank Filters will be rendered here -->
						</div>
					</div>
					<div class="flex border-b border-outline-variant/30">
						<button class="px-8 py-4 font-label-md text-label-md transition-all tab-active cursor-pointer" id="tabPersonal" onclick="switchTab('personal')">QR Cá nhân</button>
						<button class="px-8 py-4 font-label-md text-label-md text-on-surface-variant hover:text-primary transition-all cursor-pointer" id="tabGroup" onclick="switchTab('group')">QR Nhóm</button>
					</div>
				</div>
			</div>
			<!-- Subtle atmospheric elements -->
			<div class="absolute -right-20 -top-20 w-80 h-80 bg-primary/5 rounded-full blur-[100px]"></div>
			<div class="absolute -left-20 -bottom-20 w-60 h-60 bg-secondary/5 rounded-full blur-[80px]"></div>
		</div>
	</section>

	<!-- QR Grid Section -->
	<section class="px-margin-desktop max-w-container-max mx-auto">
		<!-- Personal QR Grid -->
		<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 gap-card-gap" id="personalGrid">
			<!-- Dynamically populated via JS -->
		</div>
		<!-- Group QR Grid (Hidden by default) -->
		<div class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-3 gap-card-gap" id="groupGrid">
			<!-- Dynamically populated via JS -->
		</div>
	</section>
</main>

<!-- QR Modal (Enhanced Design) -->
<div class="fixed inset-0 z-[60] hidden items-center justify-center p-4 transition-all duration-300" id="qrModal">
	<div class="modal-overlay absolute inset-0" onclick="closeQRModal()"></div>
	<div class="relative bg-white rounded-[40px] w-full max-w-xl overflow-hidden shadow-2xl transition-all duration-300 transform scale-95 opacity-0" id="modalContent">
		<!-- Modal Header -->
		<div class="px-10 pt-10 pb-4 flex justify-between items-start">
			<div>
				<h2 class="font-display-lg text-headline-lg text-on-surface tracking-tight" id="modalName">Tên chủ thẻ</h2>
				<p class="font-label-md text-label-md text-primary font-bold uppercase mt-1 tracking-widest" id="modalBank">Tên ngân hàng</p>
			</div>
			<button class="material-symbols-outlined text-outline hover:text-on-surface p-3 bg-slate-100 rounded-full transition-all active:scale-90 cursor-pointer" onclick="closeQRModal()">close</button>
		</div>
		<!-- QR Display -->
		<div class="px-10 py-6">
			<div class="relative group">
				<div class="p-8 rounded-[32px] bg-white border border-slate-100 shadow-[inset_0_2px_10px_rgba(0,0,0,0.02)] flex items-center justify-center aspect-square qr-inset">
					<img alt="QR Code High Res" class="w-full h-full object-contain" id="modalQR" src="">
				</div>
			</div>
		</div>
		<!-- Modal Footer Info -->
		<div class="px-10 pb-12 space-y-6">
			<div class="p-6 rounded-3xl bg-surface-container border border-outline-variant/30 flex justify-between items-center">
				<div>
					<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest block mb-1">Số tài khoản</span>
					<span class="font-headline-md text-headline-md text-on-surface font-mono" id="modalAccount">0000 0000 0000</span>
				</div>
				<button id="btnCopyModal" class="material-symbols-outlined text-primary p-4 bg-white border border-outline-variant/30 rounded-2xl hover:bg-primary/5 transition-all active:scale-90 shadow-sm cursor-pointer" title="Sao chép">content_copy</button>
			</div>
			<div class="flex gap-4">
				<button id="btnDownloadQR" class="flex-1 bg-primary text-on-primary py-4 rounded-2xl font-label-md text-label-md shadow-xl shadow-primary/20 active:scale-95 transition-all flex items-center justify-center gap-3 cursor-pointer">
					<span class="material-symbols-outlined">download</span>
					Tải mã QR
				</button>
				<button class="flex-1 bg-surface-container-high text-on-surface py-4 rounded-2xl font-label-md text-label-md active:scale-95 transition-all flex items-center justify-center gap-3 hover:bg-surface-container-highest cursor-pointer" onclick="closeQRModal()">
					Đóng
				</button>
			</div>
		</div>
	</div>
</div>

<script src="app.js" defer></script>
</body>
</html>
